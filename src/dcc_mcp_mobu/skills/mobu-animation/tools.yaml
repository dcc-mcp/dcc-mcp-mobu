tools:
  - name: list_takes
    description: List MotionBuilder takes with current-take state and time spans.
    input_schema: {type: object, properties: {}}
    read_only: true
    destructive: false
    idempotent: true
    execution: sync
    affinity: main
    timeout_hint_secs: 30
    source_file: scripts/list_takes.py

  - name: inspect_current_take
    description: Return the active MotionBuilder take and its local time span.
    input_schema: {type: object, properties: {}}
    read_only: true
    destructive: false
    idempotent: true
    execution: sync
    affinity: main
    timeout_hint_secs: 30
    source_file: scripts/inspect_current_take.py

  - name: list_story
    description: List MotionBuilder Story tracks, sub-tracks, and clips read-only.
    input_schema: {type: object, properties: {}}
    read_only: true
    destructive: false
    idempotent: true
    execution: sync
    affinity: main
    timeout_hint_secs: 60
    source_file: scripts/list_story.py
