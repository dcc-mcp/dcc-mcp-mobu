tools:
  - name: inspect_mapping_context
    description: Return MotionBuilder scene, asset, take, and Story shot mapping metadata.
    input_schema: {type: object, properties: {}, additionalProperties: false}
    read_only: true
    destructive: false
    idempotent: true
    execution: sync
    affinity: main
    timeout_hint_secs: 60
    source_file: scripts/inspect_mapping_context.py

  - name: check_connection
    description: Diagnose the optional dcc-mcp-fpt connection contract without exposing secrets.
    input_schema: {type: object, properties: {}, additionalProperties: false}
    read_only: true
    destructive: false
    idempotent: true
    execution: sync
    affinity: main
    timeout_hint_secs: 30
    source_file: scripts/check_connection.py
