tools:
  - name: inspect_system
    description: Inspect MotionBuilder FBSystem and FBScene metadata.
    input_schema: {type: object, properties: {}, additionalProperties: false}
    read_only: true
    destructive: false
    idempotent: true
    execution: sync
    affinity: main
    timeout_hint_secs: 20
    source_file: scripts/inspect_system.py

  - name: list_components
    description: List FBComponent identity and selection metadata from the current scene.
    input_schema:
      type: object
      additionalProperties: false
      properties:
        class_name:
          type: string
          description: Exact MotionBuilder ClassName filter, case insensitive.
        selected_only:
          type: boolean
          default: false
          description: Return only components whose Selected property is true.
        limit:
          type: integer
          minimum: 1
          maximum: 5000
          default: 500
          description: Maximum number of components to return.
    read_only: true
    destructive: false
    idempotent: true
    execution: sync
    affinity: main
    timeout_hint_secs: 30
    source_file: scripts/list_components.py

  - name: list_characters
    description: List FBCharacter characterization, input, and synchronization state.
    input_schema:
      type: object
      additionalProperties: false
      properties:
        selected_only:
          type: boolean
          default: false
          description: Return only selected characters.
        limit:
          type: integer
          minimum: 1
          maximum: 1000
          default: 200
          description: Maximum number of characters to return.
    read_only: true
    destructive: false
    idempotent: true
    execution: sync
    affinity: main
    timeout_hint_secs: 30
    source_file: scripts/list_characters.py
