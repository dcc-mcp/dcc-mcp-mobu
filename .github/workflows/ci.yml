name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    name: ${{ matrix.os }} / Python ${{ matrix.python-version }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ["3.9", "3.11", "3.12"]
        exclude:
          - os: windows-latest
            python-version: "3.9"
          - os: macos-latest
            python-version: "3.9"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install package and development tools
        run: python -m pip install -e ".[dev]"
      - name: Test
        run: pytest
      - name: Install lifecycle contract smoke
        run: python -m pytest tests/test_install_cli.py tests/test_package.py -q
      - name: Lint
        run: |
          ruff check src tests tools
          ruff format --check src tests tools
          python tools/lint_skills.py
      - name: Build distribution
        run: python -m build
      - name: Inspect lifecycle artifacts
        shell: bash
        run: |
          python -c 'import glob,zipfile; wheel=glob.glob("dist/*.whl")[0]; names=set(zipfile.ZipFile(wheel).namelist()); required={"dcc_mcp_mobu/install_cli.py","dcc_mcp_mobu/mobu_plugin/startup/dcc_mcp_mobu.py","dcc_mcp_mobu/skills/mobu-diagnostics/scripts/ping.py"}; assert required <= names, required - names'
          python -c 'import glob,tarfile; archive=glob.glob("dist/*.tar.gz")[0]; names=tarfile.open(archive,"r:gz").getnames(); assert any(name.endswith("/install.md") for name in names)'
      - name: Check distribution metadata
        run: python -m twine check dist/*
